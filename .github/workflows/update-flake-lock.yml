# Weekly flake.lock update PRs, the standard flake-repo pattern
# (DeterminateSystems/update-flake-lock). The PR is a *decision*, not an
# auto-merge: this repo's nixpkgs pin moves deliberately (a lock update can
# change boot behavior on hosts that wipe /root), so the workflow only opens
# the PR and a human reviews the lock diff and merges when wanted.
#
# DEPENDS ON a repo setting, not just on this file: Settings > Actions >
# General > Workflow permissions > "Allow GitHub Actions to create and
# approve pull requests", turned ON 2026-09-08. Without it PR creation
# fails with "GitHub Actions is not permitted to create or approve pull
# requests" while the branch push succeeds -- which is how this workflow
# spent its whole life before that date. If these PRs ever stop appearing
# while `update_flake_lock_action` keeps moving, check that box first.
#
# It grants create AND approve together; there is no setting for one
# without the other. Accepted here because approvals gate nothing in this
# repo -- both rulesets carry `required_approving_review_count: 0`, so the
# approve half bypasses no control that exists. Reconsider if a review
# requirement is ever added to experimental or main.
#
# Known caveat, still accepted: PRs opened with the default GITHUB_TOKEN do
# not trigger this repo's own pull_request workflows (GitHub refuses the
# recursive run), so `nix flake check + module tree` shows as missing rather
# than green -- and the experimental ruleset REQUIRES that check, so merging
# needs either an admin bypass or a pushed commit to the branch to trigger
# CI for real. Run `just preflight` locally either way; it is the stronger
# check, since CI does not force a host toplevel on a linux runner.
#
# Third-party actions are pinned by full SHA, not by branch: these run with
# `contents: write` against this repo, and `@main` means running whatever
# that repo's default branch says on Monday morning. actions/checkout stays
# on @v4 -- GitHub's own, same as check.yml. Bump the pins deliberately.
#
# history
#
# Floated both DeterminateSystems actions on `@main` until 2026-09-08. The
# first scheduled run (2026-09-07, the only run ever) updated the lock and
# pushed `update_flake_lock_action` fine, then failed at PR creation on the
# setting above; no PR was ever opened. The header at the time documented
# the CI-doesn't-run caveat as accepted, which presumed a PR got opened at
# all -- it never did.

name: update-flake-lock

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      # `experimental` explicitly, not the default branch implicitly: this
      # is the trunk landings target (AGENTS.md, skill `ship`), and `main`
      # is promotion-only via a PR from here. Pairs with `base` below --
      # checkout picks what gets updated, base picks what the PR targets.
      - uses: actions/checkout@v4
        with:
          ref: experimental

      - uses: DeterminateSystems/nix-installer-action@b074b4ad5f255f9c8a6a2414a2f07e7f4f2925a3 # 2026-09-08

      - uses: DeterminateSystems/update-flake-lock@daaf842c7377c22fe4dec85d511edcf4d889844a # 2026-09-08
        with:
          base: experimental
          path-to-flake-dir: flake
          pr-title: "chore: update flake.lock"
          pr-body: |
            Automated weekly `nix flake update` (all inputs), targeting
            `experimental`.

            The lock diff is the review: this repo pins nixpkgs deliberately,
            and an input bump can change what hosts build and boot. Check the
            diff, run `just preflight` locally (CI does not run on
            GITHUB_TOKEN-opened PRs -- see this workflow's header), and merge
            through the normal ship flow when the change is wanted.

            Auto-opened by the update-flake-lock workflow; close unmerged if
            the timing is wrong (mid-investigation, pre-boot-verification).
