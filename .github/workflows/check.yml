name: flake-check

# Runs `just preflight` -- the recipe itself, not a copy of its steps --
# so what gates a PR is exactly what any session runs by hand before
# opening one (the ship skill's step 0), automated instead of relying on
# that being remembered. Until 2026-09-29 this file listed preflight's
# steps a second time by hand; `just preflight-mirror-test` diffed the
# two lists. It now holds the opposite in place: this workflow must call
# `just preflight`, and may run no check of its own beyond the CI-only
# ones that test names (today only the trailer check below, which needs
# the PR's commit range). Add a check to the preflight recipe and CI
# picks it up with no edit here.
#
# Beyond preflight, this file only adds what a local run cannot or need
# not do: install the tools, warm the sops store race below, and check
# the PR's own commit trailers.
#
# The job's `name:` is the required status check in the ruleset, and is
# quoted by name in update-flake-lock.yml and wiki/maintenance.md -- do not
# rename it; a renamed job leaves the required check pending forever.
#
# One job, deliberately: an early no-nix job for the stdlib tests would
# report a broken wiki claim sooner by the length of the nix install
# (tens of seconds), but it would need its own list of those tests -- the
# copy this change removed -- and would not be a required check without a
# ruleset edit. preflight already orders the ~2s checks first.
#
# `just lint` (statix + deadnix + an oversized-file check, ratcheted
# against flake/scripts/lint-baseline.json) here is the backstop for the
# local pre-commit hook (.githooks/pre-commit, wired in via `just
# install-hooks`): the hook is opt-in per clone and skips itself silently
# if statix/deadnix aren't on PATH, so this is what actually blocks a
# regression on a contributor who never ran `just install-hooks`.
# statix/deadnix/just come from the flake's LOCKED nixpkgs
# (`--inputs-from ./flake`), the same versions packages-config/nix-utils
# puts on the hosts, so the ratchet counts match a local run.
#
# Deliberately `--no-build` (`just check`): this flake defines full
# NixOS/darwin system toplevels (`checks.nix`) for real hosts running KDE
# + a full dev toolchain, and building those from scratch on every PR
# would be slow, disk-heavy, and disproportionate to a homelab config
# (AGENTS.md, "Calibrate severity"). `--no-build` still catches the class
# of bug this repo's history is full of -- a bad `perSystem` wrapper, bare
# strings in `imports`, a module name colliding with its own category --
# all evaluation errors, not build failures. A real `switch` on the real
# host remains the only thing that proves more than this.
#
# `--all-systems` evaluates the aarch64-darwin checks too, and evaluation
# (unlike building) needs no matching builder -- this repo's sessions
# evaluate `nire-lysithea` from Linux hosts routinely. Since 2026-09-29
# checks.nix makes lysithea's toplevel and home a check; before that,
# `nix flake check` walked past darwinConfigurations without evaluating it.
#
# RUNTIME-VERIFIED TRAP, 2026-08-25, found on this workflow's first real
# runs and taking real investigation to pin down: `nix flake check
# --all-systems --no-build` intermittently failed with `error: path
# '.../secrets.yaml' is not valid`, evaluating a sops-enrolled host's
# secrets (durandal/tenacity/cube all hit it across different runs). Two
# theories that turned out WRONG, ruled out empirically before landing on
# the real one -- kept here so nobody re-chases them:
#   - NOT a stale Nix version (cachix/install-nix-action's old 2.22.1
#     default was swapped for DeterminateSystems/nix-installer-action,
#     which installs current Nix -- the failure still reproduced after).
#   - NOT the checkout shape (reproduced locally against the exact same
#     `refs/pull/N/merge` ref actions/checkout uses, full clone, shallow
#     clone, depth=1 -- none of them reproduced it; only the real CI
#     runner ever did, and not even every time there).
# The actual pattern: evaluating each sops-enrolled host separately
# forces Nix to add the SAME literal `secrets.yaml` path to the store
# once per host's own module evaluation. Warming that up with isolated
# `nix eval` calls for each host BEFORE the real `nix flake check` made
# the failure stop appearing entirely across several runs -- consistent
# with a store-registration race across near-simultaneous adds of
# identical content, not something wrong with this repo's own config.
# Mitigated two ways rather than just one: an explicit warmup step below
# (matches what empirically fixed it) plus a retry of `nix flake check`
# (in case the warmup doesn't fully close the window on a differently-
# timed run). The retry moved into flake/scripts/flake-check.sh (what
# `just check` runs) on 2026-09-29, since this file no longer runs that
# step itself, and now fires only on the `secrets.yaml' is not valid`
# text -- that script's header says why. Neither is a full root-cause fix
# for whatever's actually racing inside Nix/sops-nix -- if this stops
# being enough, that's the next place to look, not something already
# ruled out here.

on:
  pull_request:
  push:
    # Both branches are ruleset-covered since the 2026-09-03 default-branch
    # flip: the ruleset added for `main` 2026-08-21 targets ~DEFAULT_BRANCH,
    # so it followed the flip onto `experimental` -- no deletion, no
    # force-push, PR required, and this check required. `main` is also
    # protected by name (promotion-only, via a PR from `experimental`; see
    # skill `ship`). `experimental` was added to this list 2026-08-25, back
    # when it had no ruleset of its own -- the comment said so until the
    # flip made it false.
    branches: [main, experimental]

# Read-only token: this workflow only checks out and evaluates. Without the
# block the token gets the repo's default workflow permissions.
permissions:
  contents: read

jobs:
  eval-and-modules:
    # Required status check, by this exact name -- see the header.
    name: nix flake check + module tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: the trailer step walks the PR's commits back to
      # their merge base with the target. The repo is small (~11 MiB
      # packed, 2026-09-29), and a full clone is also what every local
      # preflight runs against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # First, before the nix install: stdlib Python, seconds. On a PR the
      # checkout is GitHub's refs/pull/N/merge commit, whose first parent
      # is the target branch and second the PR head, so HEAD^1..HEAD^2 is
      # exactly the PR's own commits -- steadier than the event's
      # base.sha, which can lag the target and pull already-landed commits
      # (and their old, deliberately kept, wrong trailers) into the range.
      # Skipped on push: pushes to main/experimental only land through a
      # PR (ruleset), whose commits this step already checked, and a
      # finding there could not be fixed anyway -- rewriting a protected
      # branch is what the ruleset forbids.
      - name: Co-Authored-By trailers on this PR's commits
        if: github.event_name == 'pull_request'
        run: python3 flake/scripts/check_trailers.py HEAD^1..HEAD^2

      # Pinned by full SHA, same as update-flake-lock.yml pins its actions:
      # `@main` means running whatever upstream's default branch says on
      # Monday morning, and one broken push there goes every PR red.
      # Bump the pin deliberately, like the other workflow's.
      - uses: DeterminateSystems/nix-installer-action@b074b4ad5f255f9c8a6a2414a2f07e7f4f2925a3 # 2026-09-08

      # All four hosts .sops.yaml enrolls, including the darwinConfigurations
      # entry -- nire-lysithea's config touches secrets.yaml too
      # (general-config/system/secrets/sops-darwin.nix), and checks.nix
      # forces its toplevel, so it hits the same store race this warmup
      # exists for.
      - name: warm up sops-enrolled hosts' secrets.yaml store registration
        run: |
          cd flake
          for ref in \
            nixosConfigurations.nire-durandal \
            nixosConfigurations.nire-tenacity \
            nixosConfigurations.nire-cube \
            darwinConfigurations.nire-lysithea; do
            nix eval --raw ".#$ref.config.system.build.toplevel.drvPath" > /dev/null
          done

      - name: just preflight
        run: >-
          nix shell --inputs-from ./flake
          nixpkgs#just nixpkgs#statix nixpkgs#deadnix
          --command just preflight
