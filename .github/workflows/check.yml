name: flake-check

# Mirrors `just check` + `just modules` + `just lint` exactly (see
# .justfile) rather than inventing separate CI-only logic -- what runs
# here is what any session already runs by hand before opening a PR (the
# ship skill's own step 0), just automated instead of relying on that
# being remembered every time.
#
# `just lint` (statix + deadnix + an oversized-file check, ratcheted
# against flake/scripts/lint-baseline.json) is the backstop for the local
# pre-commit hook (.githooks/pre-commit, wired in via `just
# install-hooks`) rather than a redundant re-check: the hook is opt-in
# per clone and skips itself silently if statix/deadnix aren't on PATH,
# so this is what actually blocks a regression on a contributor who never
# ran `just install-hooks`. See flake/scripts/lint.py's own header for
# why it's a ratchet rather than a plain pass/fail.
#
# Deliberately `--no-build`, matching `just check` locally: this flake
# defines full NixOS/darwin system toplevels (`checks.nix`) for real
# hosts running KDE + a full dev toolchain, and building those from
# scratch on every PR would be slow, disk-heavy, and roughly the same
# scale of cost repeatedly rejected elsewhere in this repo for being
# disproportionate to a homelab config (CLAUDE.md, "Calibrate severity").
# `--no-build` still catches the actual class of bug this repo's own
# history is full of -- a bad `perSystem` wrapper, bare strings in
# `imports`, a module name colliding with its own category -- all of
# which are evaluation errors, not build failures. A real `switch` on
# the real host remains the only thing that proves more than this; see
# CLAUDE.md's "Treat an undated 'verified' as *evaluates*" for why this
# workflow doesn't try to close that gap too.
#
# One job, ubuntu-latest, checking every system: `--all-systems` forces
# evaluation of the darwin config's checks too, and evaluation (unlike
# building) doesn't need a matching builder -- confirmed by hand from an
# x86_64-linux dev machine before writing this, the same way this repo's
# own sessions already evaluate `nire-lysithea` from Linux hosts with no
# darwin builder anywhere in reach.
#
# `modules.py check modules` runs as a separate step, not folded into the
# `nix flake check` above, for the same reason the .justfile keeps `check`
# and `modules` as two separate recipes: `checks.nix`'s own `module-tree`
# check is a derivation that has to actually RUN to mean anything, and
# `--no-build` skips exactly that -- `just modules` bypasses Nix's build
# system entirely instead of trying to force one check through --no-build.
#
# RUNTIME-VERIFIED TRAP, 2026-08-25, found on this workflow's first real
# runs and taking real investigation to pin down: `nix flake check
# --all-systems --no-build` intermittently failed with `error: path
# '.../secrets.yaml' is not valid`, evaluating a sops-enrolled host's
# secrets (durandal/tenacity/cube all hit it across different runs). Two
# theories that turned out WRONG, ruled out empirically before landing on
# the real one -- kept here so nobody re-chases them:
#   - NOT a stale Nix version (cachix/install-nix-action's old 2.22.1
#     default was swapped for DeterminateSystems/nix-installer-action,
#     which installs current Nix -- the failure still reproduced after).
#   - NOT the checkout shape (reproduced locally against the exact same
#     `refs/pull/N/merge` ref actions/checkout uses, full clone, shallow
#     clone, depth=1 -- none of them reproduced it; only the real CI
#     runner ever did, and not even every time there).
# The actual pattern: evaluating each sops-enrolled host separately
# forces Nix to add the SAME literal `secrets.yaml` path to the store
# once per host's own module evaluation. Warming that up with isolated
# `nix eval` calls for each host BEFORE the real `nix flake check` made
# the failure stop appearing entirely across several runs -- consistent
# with a store-registration race across near-simultaneous adds of
# identical content, not something wrong with this repo's own config.
# Mitigated two ways below rather than just one: an explicit warmup
# (matches what empirically fixed it) plus a retry on the real check
# (in case the warmup doesn't fully close the window on a differently-
# timed run). Neither is a full root-cause fix for whatever's actually
# racing inside Nix/sops-nix -- if this stops being enough, that's the
# next place to look, not something already ruled out here.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  eval-and-modules:
    name: nix flake check + module tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: warm up sops-enrolled hosts' secrets.yaml store registration
        run: |
          cd flake
          for host in nire-durandal nire-tenacity nire-cube; do
            nix eval --raw ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath" > /dev/null
          done

      - name: nix flake check --all-systems --no-build
        run: |
          cd flake
          nix flake check --all-systems --no-build \
            || { echo "::warning::nix flake check failed, retrying once (see this workflow's own header comment on the known intermittent secrets.yaml store race)"; sleep 5; nix flake check --all-systems --no-build; }

      - name: module tree check (just modules)
        run: cd flake && python3 scripts/modules.py check modules

      - name: lint ratchet (just lint)
        run: |
          cd flake
          nix shell nixpkgs#statix nixpkgs#deadnix --command python3 scripts/lint.py check
