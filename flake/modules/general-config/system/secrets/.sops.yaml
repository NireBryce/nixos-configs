keys:
  - &nire-durandal age19klcl9s2vlhnvgae2nhukl2ypwlq0054htgf7jpyxee2wfprmyjqdl7sfg
  - &nire-lysithea age1a3h0396j3h3925rzlhqvwhpkm909zzswkcww4e6y502xm8n7wyfsuy7cre
  - &nire-tenacity age125j57asy9he50au73pjhddw8nl3s30yj8e9e2r7qe3v428nl7fnqn09c7k

  # Added via `just age-key` (flake/scripts/host-age-key.sh) reading this
  # host's own /etc/ssh/ssh_host_ed25519_key.pub, same mechanism the other
  # three entries above came from -- not a standalone age-keygen keypair.
  - &nire-cube age1t39hwd3re7pp2m7ghdufz5p2rsmd8r9ty6f8te7055l5gu996a3smugvq9

  # USER keys, not host keys like the five above -- ssh-to-age against a
  # personal SSH pubkey (`host-age-key.sh --pubkey-file`), not any host's
  # SSH host key. Recipients on low-side/secrets.yaml only, never on the
  # main secrets.yaml above: anything running as elly can decrypt that
  # file with no sudo and no NixOS activation step, by design -- see
  # low-side/secrets.yaml's own header before adding anything else to it.
  #
  # &elly-agent is durandal's agent key, and is the identity low-side
  # decryption derives from there on purpose: the human key
  # (elly@durandal) is to be passphrase-protected, and ssh-to-age cannot
  # derive an age identity from an encrypted key file -- an unpassphrased
  # key must exist for this flow regardless, and the agent key is the one
  # whose plaintextness is bounded by authorizedKeys options in ssh.nix.
  - &elly-agent age13lwuq7cvrs4w07xw7rhrh6jwhag5vta038uzsa0zp0wg6096qg5sxgefkr
  - &elly-lysithea age1j56xctqgpp7sgay4yta7g47rusr54kxv8nk0r9tvlpf8jxffg4jqu6qrzf
creation_rules:
  # ORDER MATTERS: sops takes the first matching rule, and neither `path`
  # here is `^`-anchored -- `./secrets.yaml$` is a regex where `.` matches
  # ANY character, so it also matches the "e" before "/secrets.yaml" in
  # "low-side/secrets.yaml". Confirmed the hard way: with the general rule
  # listed first, `sops --encrypt` on low-side/secrets.yaml silently
  # wrapped it for all four host keys instead of just *elly. The specific
  # rule has to come before the general one for that reason, not stylistic
  # preference.
  # Per-machine agent SSH keys first (sops takes the first matching rule):
  # one file per host, each encrypted to that host's key only, so a host
  # decrypts its own and nothing else. sops-nix materializes only the file
  # a host's module declares (agent-keys.nix). Patterns are $-anchored and
  # deliberately carry no leading ./ -- the unanchored ./-prefix rules
  # below have already matched paths they were not written for (first
  # observed 2026-10-30: the low-side rule wrapped every agent-keys file).
  - path_regex: 'agent-keys/nire-cube\.yaml$'
    key_groups:
      - age:
          - *nire-cube
  - path_regex: 'agent-keys/nire-durandal\.yaml$'
    key_groups:
      - age:
          - *nire-durandal
  - path_regex: 'agent-keys/nire-lysithea\.yaml$'
    key_groups:
      - age:
          - *nire-lysithea
  - path_regex: 'agent-keys/nire-tenacity\.yaml$'
    key_groups:
      - age:
          - *nire-tenacity
  - path: ./low-side/secrets.yaml$
    key_groups:
      - age:
          - *elly-agent
          - *elly-lysithea
  # - path_regex: ./secrets.yaml$
  - path: ./secrets.yaml$
    key_groups:
      - age:
          - *nire-durandal
          - *nire-lysithea
          - *nire-tenacity
          - *nire-cube
